services:
  hackathons:
    build:
      context: ./src/HackathonService
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Default: "Data Source=/data/hackathons.db"
    volumes:
      - hackathon-data:/data

  projects:
    build:
      context: ./src/ProjectService
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Default: "Data Source=/data/projects.db"
      Services__HackathonService: "http://hackathons:8080"
    volumes:
      - project-data:/data
    depends_on:
      - hackathons

  tasks:
    build:
      context: ./src/TaskService
    ports:
      - "5003:8080"
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Default: "Data Source=/data/tasks.db"
    volumes:
      - task-data:/data

volumes:
  hackathon-data:
  project-data:
  task-data:
