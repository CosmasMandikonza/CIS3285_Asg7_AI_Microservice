name: Build and test microservices

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - src/HackathonService/HackathonService.csproj
          - src/ProjectService/ProjectService.csproj
          - src/TaskService/TaskService.csproj
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore "${{ matrix.project }}"
      - name: Build
        run: dotnet build "${{ matrix.project }}" --configuration Release --no-restore

  docker-integration:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the microservices
        run: docker compose up --build -d

      - name: Wait for health endpoints
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:5001/health > /dev/null               && curl --fail --silent http://localhost:5002/health > /dev/null               && curl --fail --silent http://localhost:5003/health > /dev/null; then
              echo "All services are healthy."
              exit 0
            fi
            echo "Waiting for services... attempt $attempt"
            sleep 2
          done

          docker compose logs
          exit 1

      - name: Verify service-to-service communication
        run: curl --fail --silent http://localhost:5002/projects/1/summary

      - name: Show container status
        run: docker compose ps

      - name: Stop containers
        if: always()
        run: docker compose down -v
